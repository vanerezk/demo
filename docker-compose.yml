# Entorno local: PrestaShop 1.7.8 (es / EUR) + MariaDB.
# La instalación es automática; al terminar, docker/post-install/ activa el Webservice
# y crea la clave de API definida en PS_WEBSERVICE_KEY.
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-prestashop}
      MARIADB_DATABASE: prestashop
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  prestashop:
    image: prestashop/prestashop:1.7.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PS_HTTP_PORT:-8080}:80'
    environment:
      DB_SERVER: db
      DB_USER: root
      DB_PASSWD: ${DB_ROOT_PASSWORD:-prestashop}
      DB_NAME: prestashop
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:${PS_HTTP_PORT:-8080}
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_ALL_LANGUAGES: 0
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
      PS_ENABLE_SSL: 0
      ADMIN_MAIL: ${PS_ADMIN_MAIL:-demo@example.com}
      ADMIN_PASSWD: ${PS_ADMIN_PASSWORD:-prestashop_demo}
      PS_WEBSERVICE_KEY: ${PS_WEBSERVICE_KEY:?Define PS_WEBSERVICE_KEY en .env}
    volumes:
      - ps-data:/var/www/html
      - ./docker/post-install:/tmp/post-install-scripts:ro
      - ./docker/webservice.sql:/opt/catalog-sync/webservice.sql:ro

volumes:
  db-data:
  ps-data:
